name: Pull Request Validation

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  changelog-validation:
    name: Validate Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if CHANGELOG.md was updated
        id: changelog_check
        run: |
          # Check if CHANGELOG.md has been modified in this PR
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "CHANGELOG.md"
          if [ $? -eq 0 ]; then
            echo "✅ CHANGELOG.md has been updated"
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ CHANGELOG.md was not updated"
            echo "updated=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Comment on PR if changelog is missing
        if: steps.changelog_check.outputs.updated == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **CHANGELOG.md** was not updated. Please document your changes.'
            })

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript check
        run: npx tsc --noEmit
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css,md}"
        continue-on-error: true

  testing:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm run test
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Run E2E tests
        run: npm run test:e2e
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            playwright-report/
            coverage/
          retention-days: 30
      
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        continue-on-error: true

  spec-validation:
    name: Specification Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run spec validation
        run: npm run spec:check
        continue-on-error: true
      
      - name: Upload spec reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-reports
          path: spec-coverage.json
          retention-days: 30

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      
      - name: Check build size
        run: |
          echo "📦 Build size analysis:"
          du -sh .next
          du -sh .next/static

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [changelog-validation, code-quality, testing, spec-validation, build-check]
    if: always()
    steps:
      - name: Create PR Summary
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `
            ## 🔍 Pull Request Validation Summary
            
            | Check | Status |
            |-------|--------|
            | Changelog | ${{ needs.changelog-validation.result }} |
            | Code Quality | ${{ needs.code-quality.result }} |
            | Testing | ${{ needs.testing.result }} |
            | Spec Validation | ${{ needs.spec-validation.result }} |
            | Build | ${{ needs.build-check.result }} |
            
            Please review the checks above and ensure all are passing before merging.
            `;
            
            await core.summary
              .addRaw(summary)
              .write();
